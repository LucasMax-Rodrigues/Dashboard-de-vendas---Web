<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Vendas & Estoque</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <audio id="som-sucesso" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav" preload="auto"></audio>
    <audio id="som-venda" src="https://assets.mixkit.co/active_storage/sfx/1653/1653-84.wav" preload="auto"></audio>

    <div class="dashboard-container">
        
        <header class="main-header">
            <div class="header-overlay">
                <h1>Gerenciador de Vendas</h1>
                <p>Controle de estoque, faturamento e métricas em tempo real</p>
            </div>
        </header>

        <section class="metrics-grid">
            <div class="card metric-card">
                <h3>Média de Preços</h3>
                <p id="media-preco">R$ 0,00</p>
            </div>
            <div class="card metric-card">
                <h3>Produto Mais Caro</h3>
                <p id="produto-caro">—</p>
            </div>
            <div class="card metric-card">
                <h3>Produto Mais Barato</h3>
                <p id="produto-barato">—</p>
            </div>
        </section>

        <div class="content-layout">
            <aside class="card form-section">
                <h2>Registrar Novo Produto</h2>
                <form id="form-produto">
                    <div class="input-group">
                        <label for="nome">Nome do Produto</label>
                        <input type="text" id="nome" placeholder="Ex: Teclado Mecânico RGB" required>
                    </div>
                    <div class="input-group">
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" step="0.01" min="0.01" placeholder="Ex: 249.90" required>
                    </div>
                    <button type="submit" id="btn-cadastrar">Cadastrar Produto</button>
                </form>
            </aside>

            <main class="card table-section">
                <h2>Produtos em Estoque</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Preço</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-produtos">
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
